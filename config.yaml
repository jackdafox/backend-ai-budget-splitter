app:
  host: "0.0.0.0"
  port: 8080
  env: "development"

database:
  host: "localhost"
  port: 5432
  user: "postgres"
  password: "postgres"
  name: "ai_budget_splitter"
  sslmode: "disable"

ai_providers:
  openai:
    base_url: "https://api.openai.com/v1"
    api_key: "${OPENAI_API_KEY}"
  anthropic:
    base_url: "https://api.anthropic.com/v1"
    api_key: "${ANTHROPIC_API_KEY}"

auth:
  jwt_secret: "${JWT_SECRET}"
  key_expire_days: 90
